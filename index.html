<!DOCTYPE html>
<html lang="tr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dilan Shop — Kozmetik & Güzellik</title>
<meta name="description" content="Dilan Shop — Erbil merkezli kozmetik ve güzellik mağazası. Makyaj, cilt bakımı, saç bakımı, parfüm ve daha fazlası.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Topbar -->
<div class="topbar">
  <div class="container">
    <div class="topbar-left">
      <span><span class="ic" data-icon="truck" style="width:14px;height:14px;display:inline-flex"></span> <span data-i18n="topbar.shipping"></span></span>
      <span data-i18n="topbar.delivery"></span>
    </div>
    <div class="topbar-right">
      <div class="lang-switch">
        <button id="langToggle" type="button">
          <span id="currentLangLabel">Türkçe</span>
          <span class="ic" data-icon="chevronDown" style="width:14px;height:14px;display:inline-flex"></span>
        </button>
        <div class="lang-menu" id="langMenu">
          <button data-lang="tr">Türkçe</button>
          <button data-lang="ar">العربية</button>
          <button data-lang="ku">کوردی</button>
          <button data-lang="en">English</button>
        </div>
      </div>
      <a href="#" data-i18n="topbar.about"></a>
      <a href="#" data-i18n="topbar.contact"></a>
    </div>
  </div>
</div>

<!-- Header -->
<header class="site-header">
  <div class="container header-row">
    <button class="burger" id="burgerBtn" aria-label="menu"><span class="ic" data-icon="menu" style="width:22px;height:22px;display:inline-flex"></span></button>
    <a href="index.html" class="logo">
      <span class="logo-main">Dilan<em>Shop</em></span>
      <span class="logo-sub">KOZMETİK &amp; GÜZELLİK</span>
    </a>
    <form class="search-form" role="search">
      <input type="search" data-i18n-placeholder="search" placeholder="Search">
      <button type="submit" aria-label="search"><span class="ic" data-icon="search" style="width:18px;height:18px;display:inline-flex"></span></button>
    </form>
    <div class="header-actions">
      <a href="#" class="header-action">
        <span class="ic" data-icon="user"></span>
        <span><span class="label-sub" data-i18n="account"></span><span class="label-main" data-i18n="login"></span></span>
      </a>
      <a href="#" class="header-action">
        <span class="ic" data-icon="heart"></span>
        <span data-i18n="wishlist"></span>
        <span class="badge" data-render="wishlist-badge">0</span>
      </a>
      <a href="#" class="header-action" id="cartTrigger">
        <span class="ic" data-icon="bag"></span>
        <span data-i18n="cart"></span>
        <span class="badge" data-render="cart-badge">0</span>
      </a>
    </div>
  </div>

  <!-- Nav -->
  <nav class="nav-bar">
    <div class="container nav-row">
      <a href="products.html" class="all-categories">
        <span class="ic" data-icon="menu" style="width:16px;height:16px;display:inline-flex"></span>
        <span data-i18n="nav.allCategories"></span>
      </a>
      <div class="nav-links">
        <a href="index.html" class="active" data-i18n="nav.home"></a>
        <a href="products.html?category=makeup" data-i18n="nav.makeup"></a>
        <a href="products.html?category=skincare" data-i18n="nav.skincare"></a>
        <a href="products.html?category=haircare" data-i18n="nav.haircare"></a>
        <a href="products.html?category=perfume" data-i18n="nav.perfume"></a>
        <a href="products.html?category=accessories" data-i18n="nav.accessories"></a>
        <a href="products.html" data-i18n="nav.brands"></a>
        <a href="products.html" class="sale" data-i18n="nav.sale"></a>
      </div>
    </div>
  </nav>
</header>

<!-- Mobile nav drawer -->
<div class="mobile-nav" id="mobileNav">
  <div class="mobile-nav-head">
    <span class="logo-main" style="font-size:18px;color:var(--ink)">Dilan<em style="color:var(--pink)">Shop</em></span>
    <button id="mobileNavClose" aria-label="close"><span class="ic" data-icon="close" style="width:20px;height:20px;display:inline-flex"></span></button>
  </div>
  <ul>
    <li><a href="index.html" data-i18n="nav.home"></a></li>
    <li><a href="products.html?category=makeup" data-i18n="nav.makeup"></a></li>
    <li><a href="products.html?category=skincare" data-i18n="nav.skincare"></a></li>
    <li><a href="products.html?category=haircare" data-i18n="nav.haircare"></a></li>
    <li><a href="products.html?category=perfume" data-i18n="nav.perfume"></a></li>
    <li><a href="products.html?category=accessories" data-i18n="nav.accessories"></a></li>
    <li><a href="products.html" data-i18n="nav.brands"></a></li>
  </ul>
</div>

<!-- Hero -->
<section class="hero">
  <div class="container hero-inner">
    <div>
      <div class="hero-eyebrow" data-i18n="hero.eyebrow"></div>
      <h1 class="hero-title"><span data-i18n="hero.titleLine1"></span> <span class="accent" data-i18n="hero.titleLine2"></span></h1>
      <p class="hero-sub" data-i18n="hero.subtitle"></p>
      <a href="products.html" class="btn btn-primary" data-i18n="hero.cta"></a>
    </div>
    <div class="hero-visual">
      <div class="hero-ring"></div>
      <div class="hero-card">
        <svg viewBox="0 0 24 24" fill="none" stroke="#c9a15a" stroke-width="1.2"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M9 7h6l1.5 3v9a2 2 0 01-2 2h-5a2 2 0 01-2-2v-9L9 7z"/></svg>
      </div>
      <div class="hero-dots"><span class="active"></span><span></span><span></span></div>
    </div>
  </div>
</section>

<!-- Trust strip -->
<section class="trust-strip">
  <div class="container trust-row">
    <div class="trust-item"><span class="ic" data-icon="truck"></span><div><strong data-i18n="trust.0.title"></strong><span data-i18n="trust.0.sub"></span></div></div>
    <div class="trust-item"><span class="ic" data-icon="bolt"></span><div><strong data-i18n="trust.1.title"></strong><span data-i18n="trust.1.sub"></span></div></div>
    <div class="trust-item"><span class="ic" data-icon="shield"></span><div><strong data-i18n="trust.2.title"></strong><span data-i18n="trust.2.sub"></span></div></div>
    <div class="trust-item"><span class="ic" data-icon="refresh"></span><div><strong data-i18n="trust.3.title"></strong><span data-i18n="trust.3.sub"></span></div></div>
    <div class="trust-item"><span class="ic" data-icon="headset"></span><div><strong data-i18n="trust.4.title"></strong><span data-i18n="trust.4.sub"></span></div></div>
  </div>
</section>

<!-- Categories -->
<section class="section">
  <div class="container">
    <div class="section-head">
      <h2 class="section-title" data-i18n="categoriesTitle"></h2>
      <a href="products.html" class="view-all"><span data-i18n="viewAll"></span></a>
    </div>
    <div class="categories-row" data-render="categories"></div>
  </div>
</section>

<!-- Bestsellers + promo -->
<section class="section" style="padding-top:0">
  <div class="container">
    <div class="bestsellers-grid">
      <div>
        <div class="section-head">
          <h2 class="section-title" data-i18n="bestsellersTitle"></h2>
          <a href="products.html" class="view-all"><span data-i18n="viewAll"></span></a>
        </div>
        <div class="product-grid" data-render="bestsellers"></div>
      </div>
      <div class="promo-panel">
        <h3 data-i18n="promo.title"></h3>
        <p data-i18n="promo.subtitle"></p>
        <span class="promo-badge" data-i18n="promo.badge"></span>
        <a href="products.html" class="btn btn-dark" data-i18n="promo.cta"></a>
        <div class="feature-list">
          <div class="feature-item"><span class="ic" data-icon="tag"></span><div><strong data-i18n="features.0.title"></strong><span data-i18n="features.0.sub"></span></div></div>
          <div class="feature-item"><span class="ic" data-icon="check"></span><div><strong data-i18n="features.1.title"></strong><span data-i18n="features.1.sub"></span></div></div>
          <div class="feature-item"><span class="ic" data-icon="card"></span><div><strong data-i18n="features.2.title"></strong><span data-i18n="features.2.sub"></span></div></div>
          <div class="feature-item"><span class="ic" data-icon="smile"></span><div><strong data-i18n="features.3.title"></strong><span data-i18n="features.3.sub"></span></div></div>
        </div>
      </div>
    </div>

    <div class="whatsapp-banner">
      <div class="whatsapp-left">
        <span class="ic" data-icon="whatsapp"></span>
        <div><strong data-i18n="whatsapp.title"></strong><span data-i18n="whatsapp.sub"></span></div>
      </div>
      <button class="btn btn-whatsapp" data-action="whatsapp-quick"><span class="ic" data-icon="whatsapp" style="width:16px;height:16px;display:inline-flex"></span><span data-i18n="whatsapp.cta"></span></button>
    </div>
  </div>
</section>

<!-- Newsletter -->
<section class="newsletter-band">
  <div class="container newsletter-row">
    <div class="newsletter-copy">
      <span class="ic" data-icon="mail"></span>
      <div><strong data-i18n="newsletter.title"></strong><span data-i18n="newsletter.sub"></span></div>
    </div>
    <form class="newsletter-form">
      <input type="email" required data-i18n-placeholder="newsletter.placeholder" placeholder="Email">
      <button type="submit" data-i18n="newsletter.cta"></button>
    </form>
  </div>
</section>
<section class="newsletter-band" style="background:var(--white); border-top:1px solid var(--blush-deep)">
  <div class="container newsletter-row">
    <div class="social-copy">
      <div><strong data-i18n="social.title"></strong><span data-i18n="social.sub"></span></div>
    </div>
    <div class="social-icons">
      <a href="#" aria-label="instagram"><span data-icon="instagram"></span></a>
      <a href="#" aria-label="facebook"><span data-icon="facebook"></span></a>
      <a href="#" aria-label="tiktok"><span data-icon="tiktok"></span></a>
      <a href="#" aria-label="snapchat"><span data-icon="snapchat"></span></a>
    </div>
  </div>
</section>

<!-- Footer -->
<footer class="site-footer">
  <div class="container">
    <div class="footer-grid">
      <div class="social-icons">
  <a href=https://www.instagram.com/juwankare_dilan/?__pwa=1" target="_blank" aria-label="instagram"><span data-icon="instagram"></span></a>
  <a href="https://www.facebook.com/YOUR_FACEBOOK_USERNAME" target="_blank" aria-label="facebook"><span data-icon="facebook"></span></a>
  <a href="https://www.tiktok.com/@dilan_cosmatic?_r=1&_t=ZS-98PCJI4hxZv" target="_blank" aria-label="tiktok"><span data-icon="tiktok"></span></a>
  <a href=https://snapchat.com/t/mKIrPf3S" target="_blank" aria-label="snapchat"><span data-icon="snapchat"></span></a>
</div>
      <div class="footer-col">
        <h4 data-i18n="footer.categories"></h4>
        <ul>
          <li><a href="products.html?category=makeup" data-i18n="nav.makeup"></a></li>
          <li><a href="products.html?category=skincare" data-i18n="nav.skincare"></a></li>
          <li><a href="products.html?category=haircare" data-i18n="nav.haircare"></a></li>
          <li><a href="products.html?category=perfume" data-i18n="nav.perfume"></a></li>
          <li><a href="products.html?category=accessories" data-i18n="nav.accessories"></a></li>
        </ul>
      </div>
      <div class="footer-col">
        <h4 data-i18n="footer.info"></h4>
        <ul data-render="footer-info"></ul>
      </div>
      <div class="footer-col">
        <h4 data-i18n="footer.contact"></h4>
        <ul class="footer-contact">
          <li><span data-icon="pin"></span><span data-i18n="footer.address"></span></li>
          <li><span data-icon="phone"></span><span>0750 410 02 02</span></li>
          <li><span data-icon="mail"></span><span>dilanshop.com</span></li>
        </ul>
      </div>
    </div>
    <div class="footer-bottom">
      <span data-i18n="footer.rights"></span>
      <span class="pay-icons"><span>VISA</span> · <span>MASTERCARD</span></span>
    </div>
  </div>
</footer>

<!-- Cart drawer -->
<div class="overlay" id="overlay"></div>
<aside class="cart-drawer" id="cartDrawer">
  <div class="cart-header">
    <h3 data-i18n="cartDrawer.title"></h3>
    <button class="cart-close" id="cartClose" aria-label="close"><span data-icon="close"></span></button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-footer">
    <div class="cart-total-row"><span data-i18n="cartDrawer.total"></span><span id="cartTotal">0</span></div>
    <button class="btn btn-primary" id="checkoutBtn">
      <span class="ic" data-icon="whatsapp" style="width:16px;height:16px;display:inline-flex"></span>
      <span data-i18n="cartDrawer.checkout"></span>
    </button>
  </div>
</aside>

<div class="toast" id="toast"></div>

<script src="js/i18n.js"></script>
<script src="js/products.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', ()=>{
    const list = document.querySelector('[data-render="footer-info"]');
    if (list){
      const lang = getLang();
      const links = I18N[lang].footer.infoLinks;
      list.innerHTML = links.map(l=>`<li><a href="#">${l}</a></li>`).join('');
    }
  });
</script>
</body>
</html>
